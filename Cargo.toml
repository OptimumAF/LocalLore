[workspace]
members = ["crates/locallore", "crates/locallore-android", "crates/locallore-storage", "crates/locallore-workspace", "apps/desktop/src-tauri"]
default-members = ["crates/locallore", "crates/locallore-android", "crates/locallore-storage", "crates/locallore-workspace"]
exclude = ["crates/locallore-local-runtime", "crates/locallore-eval"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
