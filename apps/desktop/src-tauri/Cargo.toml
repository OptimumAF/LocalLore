[package]
name = "locallore-desktop-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

[dependencies]
locallore = { path = "../../../crates/locallore", features = ["host"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "custom-protocol"] }
tokio = { version = "=1.54.1", features = ["sync"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[workspace]
