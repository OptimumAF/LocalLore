[package]
name = "locallore-desktop-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

[dependencies]
locallore-storage = { path = "../../../crates/locallore-storage" }
locallore-eval = { path = "../../../crates/locallore-eval", features = ["local-model"] }
locallore = { path = "../../../crates/locallore", features = ["host"] }
locallore-workspace = { path = "../../../crates/locallore-workspace" }
serde = { workspace = true }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
locallore-local-runtime = { path = "../../../crates/locallore-local-runtime", features = ["engine-adapter"] }
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "custom-protocol"] }
tokio = { version = "=1.54.1", features = ["sync", "time"] }

[features]
default = []
dev-harness = ["dep:webview2-com"]

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "=0.39.1", optional = true }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[[test]]
name = "harness_contract"
path = "tests/harness_contract.rs"
required-features = ["dev-harness"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dev-dependencies]
locallore-local-runtime = { path = "../../../crates/locallore-local-runtime", features = ["engine-adapter", "development-worker"] }
