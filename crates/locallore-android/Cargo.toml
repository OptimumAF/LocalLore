[package]
name = "locallore-android"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
locallore = { path = "../locallore" }
locallore-workspace = { path = "../locallore-workspace" }
