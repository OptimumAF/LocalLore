[package]
name = "locallore-android"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Development SDK experiment only; production Android never enables these JNI exports.
play-probe = []
# Only the separately identified archive-capacity instrumentation build enables this.
archive-capacity-fixture = ["locallore-storage/development-fixtures"]

[[example]]
name = "platform_roundtrip"
test = true

[[example]]
name = "parent_retention_fixture"
test = true

[dependencies]
locallore = { path = "../locallore" }
locallore-storage = { path = "../locallore-storage" }
locallore-workspace = { path = "../locallore-workspace" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.21.1", default-features = false }
