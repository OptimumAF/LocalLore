[package]
name = "locallore-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
description = "Bounded synthetic deterministic evaluation using the shared durable Host"

[workspace]

[features]
local-model = ["dep:locallore-local-runtime"]
# Opt-in fixed-child ownership tests. No arbitrary executable or model input.
protocol-owner-tests = ["local-model", "locallore-local-runtime/development-worker"]

[dependencies]
locallore-local-runtime = { path = "../locallore-local-runtime", features = ["engine-adapter"], optional = true }
locallore = { path = "../locallore", features = ["host"] }
locallore-workspace = { path = "../locallore-workspace" }
locallore-storage = { path = "../locallore-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
